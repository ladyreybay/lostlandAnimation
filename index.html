<!DOCTYPE html>
<html id="htmlScroll">
    <head>
        <title>VIO 202 Comic Animation</title>
        <link href="css/style.css" rel="stylesheet" type="text/css"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    </head>
    <body>
        <div id="contain">
            <div id="cityImgs">
                <div id="lostlandImgs">
                    <img src="media/images/lostlandIsland.png" id="lostland" class="toVeryFront"/>
                    <img src="media/images/lostlandBack.png" id="lostlandIslandSky" class="toVeryBack"/>
                </div>
                <img src="media/videos/StoryIntroText.gif" class="toVeryFront" id="textIntro"/>
                <img src="media/images/cityFrontBuilds.png" class="toVeryFront"/>
                <img src="media/images/cityBackBuilds.png" class="toBack"/>
                <img src="media/images/cloudsFast.png" id="cloudsFast" class="toVeryBack"/>
                <img src="media/images/cloudsSlow.png" id="cloudsSlow" class="toVeryBack"/>   
                <img src="media/images/cityBackSky.png"/>
            </div>
            <div id="roomImgs">
                <img src="media/images/cursorHandFollow.png" id="cursorFollow" class="toVeryFront"/>
                <!--<img src="media/videos/wakeUpSequence.gif" class="toBack" id="notFinal"/>-->
                <img src="media/videos/wakeUpPans.gif" id="wakeUp" class="toVeryFront"/>
                <img src="media/videos/alarmNoiseText.gif" id="phoneAlarmText" class="toVeryFront"/>
                <img src="media/videos/PhoneAlarm.gif" id="phoneAlarm" class="toVeryFront"/> 
                <img src="media/images/roomBack.png" class="toBack"/>
            </div>
            <div id="roomToBathImgs">
                <img src="media/images/SecondHalfHoriStory.jpg" id="notFinal"/>
            </div>
            <div id="bathClickBreakImg">
                <img src="media/images/bathClickBreak.png" id="bathClickBreak"/>
            </div>
            <div id="bathImgs">
                <img src="media/images/SecondHalfHoriStory2.jpg" id="notFinal"/>
            </div>
            <div id="afterBreakout"></div>
                <div id="confrontImgs">
                    <img src="media/images/mirrorBreakTypo.png" id="breakTypo" class="changeVis"/>
                    <img src="media/images/SecondHalfHoriStory3.jpg" id="notFinal" class="changeVis"/>
                </div>
                <div id="exitImgs">
                    <img src="media/images/lostlandSign.png" id="lostlandSign" class="changeVis"/>
                    <img src="media/images/lostlandIslandBack.png" id="lostlandIslandBack" class="changeVis"/>
                    <img src="media/images/SecondHalfStory4.jpg" id="notFinal" class="changeVis"/>
                </div>
                <div id="finalFreedomImgs">
                    <img src="media/images/SecondHalfStory5.jpg" id="notFinal" class="changeVis"/>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
        <script src="extraScript.js"></script>
    </body>
</html>
